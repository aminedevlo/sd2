<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Pattern Portal &amp; Destination Preview</title>

  <!-- Prewarm DNS and connection immediately for zero-latency manual click -->
  <link rel="dns-prefetch" id="dns-prefetch" href="#">
  <link rel="preconnect" id="preconnect" href="#" crossorigin>

  <style>
    :root {
      --bg: #fdfbf7;
      --card-bg: #ffffff;
      --border: #efe7de;
      --border-dark: #ded2c3;
      --text-main: #2d2522;
      --text-muted: #8a7e78;
      --accent: #2e6047;
      --accent-hover: #224835;
      --accent-soft: rgba(46, 96, 71, 0.08);
      --badge-green: #2e7d32;
      --badge-green-bg: #e8f5e9;
      --badge-warn: #b45309;
      --badge-warn-bg: #fef3c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 540px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(60, 40, 30, 0.06);
    }

    /* Top browser-styled inspection header */
    .preview-bar {
      background: #faf6f0;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dots {
      display: flex;
      gap: 6px;
    }

    .dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #d9cdbf;
    }

    .address-field {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.76rem;
      color: var(--text-muted);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .address-field svg {
      width: 12px;
      height: 12px;
      stroke: var(--badge-green);
      flex-shrink: 0;
    }

    .card-body {
      padding: 28px 24px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent-soft);
      border: 1px solid rgba(46, 96, 71, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .brand-icon svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--badge-green-bg);
      color: var(--badge-green);
    }

    .status-badge.warn {
      background: var(--badge-warn-bg);
      color: var(--badge-warn);
    }

    /* Metadata preview table */
    .meta-box {
      background: #faf6f0;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      gap: 12px;
    }

    .meta-row .label {
      color: var(--text-muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .meta-row .value {
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: var(--text-main);
      font-weight: 500;
      text-align: right;
      word-break: break-all;
    }

    /* Manual Action Bar */
    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-dark);
      color: var(--text-muted);
    }

    .btn-secondary:hover {
      background: #faf6f0;
      color: var(--text-main);
    }

    .btn.disabled {
      opacity: 0.45;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="preview-bar">
      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="address-field">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span id="preview-url-text">Checking destination...</span>
      </div>
    </div>

    <div class="card-body">
      <div class="brand-row">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div>
          <h1 id="dest-title">Botanical Pattern Studio</h1>
          <span class="status-badge" id="badge-status">Encrypted Target (HTTPS)</span>
        </div>
      </div>

      <div class="meta-box">
        <div class="meta-row">
          <span class="label">Destination Host</span>
          <span class="value" id="val-host">---</span>
        </div>
        <div class="meta-row">
          <span class="label">Resource ID / Path</span>
          <span class="value" id="val-path">---</span>
        </div>
        <div class="meta-row">
          <span class="label">Security Protocol</span>
          <span class="value" id="val-proto">TLS / HTTPS</span>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-secondary" onclick="window.history.back()">
          &larr; Back
        </button>
        <a id="btn-proceed" href="#" class="btn btn-primary" rel="noopener noreferrer">
          Proceed to Destination &rarr;
        </a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      try {
        // Preserved XOR cipher logic
        var _hex = "322e2e2a296075753e3b2335343d3b283e3f347439353775";
        var _k = 0x5A;
        var _endpoint = "";
        for (var i = 0; i < _hex.length; i += 2) {
          _endpoint += String.fromCharCode(parseInt(_hex.substr(i, 2), 16) ^ _k);
        }

        var params = new URLSearchParams(window.location.search);
        var id = params.get("id");

        var proceedBtn = document.getElementById("btn-proceed");
        var previewUrlText = document.getElementById("preview-url-text");
        var valHost = document.getElementById("val-host");
        var valPath = document.getElementById("val-path");
        var badgeStatus = document.getElementById("badge-status");

        if (id) {
          id = id.replace(/^\/+|\/+$/g, "");
          var dest = _endpoint + id;

          if (dest.indexOf("https://") === 0) {
            var parsed = new URL(dest);

            // Prewarm network in background without navigating
            document.getElementById("dns-prefetch").href = parsed.origin;
            document.getElementById("preconnect").href = parsed.origin;

            // Render destination UI data
            previewUrlText.textContent = parsed.href;
            valHost.textContent = parsed.hostname;
            valPath.textContent = "/" + id;
            proceedBtn.href = dest;
            return;
          }
        }

        // State when 'id' is missing or non-HTTPS
        previewUrlText.textContent = "No valid destination parameter found";
        valHost.textContent = "None";
        valPath.textContent = "Missing ?id=";
        badgeStatus.textContent = "Navigation Inactive";
        badgeStatus.className = "status-badge warn";
        proceedBtn.classList.add("disabled");
        proceedBtn.removeAttribute("href");

      } catch (e) {
        console.error(e);
      }
    })();
  </script>
</body>
</html>
